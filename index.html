<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Web Test</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111111, #1f1f1f);
            color: #ffffff;
            text-align: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 153, 0, 0.25);
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .badge {
            display: inline-block;
            margin-bottom: 14px;
            padding: 6px 12px;
            border-radius: 999px;
            background: #ff9900;
            color: #111111;
            font-size: 13px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 12px;
            color: #ff9900;
            font-size: 32px;
        }

        p {
            margin: 10px 0;
            font-size: 17px;
            line-height: 1.6;
            color: #f2f2f2;
        }

        #time {
            margin-top: 18px;
            font-size: 15px;
            color: #ffd18a;
        }

        .btn {
            margin-top: 22px;
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: #ff9900;
            color: #111111;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">AWS CLOUD</div>
        <h1>🚀 AWS Web Test</h1>
        <p>Website ini berhasil berjalan di cloud dengan tema AWS.</p>
        <p>Siap digunakan untuk uji deploy web app sederhana.</p>
        <p id="time"></p>
        <button class="btn" onclick="showMessage()">Klik Saya</button>
    </div>

    <script>
        function showMessage() {
            alert("Halo! Website kamu sudah berhasil berjalan di AWS 🎉");
        }

        function updateTime() {
            const now = new Date();
            document.getElementById("time").innerText = "Waktu sekarang: " + now.toLocaleString();
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
